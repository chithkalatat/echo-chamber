services:
  backend:
    build: ./server
    container_name: echo_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/echochamber
      - JWT_SECRET=supersecretkey
    depends_on:
       mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:latest
    container_name: echo_mongo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mongo-data:/data/db

  frontend:
    build: ./client
    container_name: echo_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo-data: